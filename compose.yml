services:
  trainer:
    build:
      context: .
      dockerfile: server/Dockerfile
    expose:
      - "8000"
    environment:
      TRAINER_USERNAME: "${TRAINER_USERNAME:-trainer}"
      TRAINER_PASSWORD_RANDOM_EACH_START: "${TRAINER_PASSWORD_RANDOM_EACH_START:-1}"
      SESSION_SECRET: "${SESSION_SECRET:-change-this-too}"
      TRAINER_PUBLIC_URL: "${TRAINER_PUBLIC_URL:-https://training.catfacts.cc}"
      TRAINER_DB_PATH: /data/trainer.sqlite3
      TRAINER_AUDIO_DIR: /data/audio
      TRAINER_RECORDING_DIR: /data/recordings
    volumes:
      - trainer-data:/data
      - ./server/audio:/data/audio:ro
    restart: unless-stopped

  caddy:
    image: caddy:latest
    depends_on:
      - trainer
    ports:
      - "9000:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  trainer-data:
  caddy_data:
  caddy_config:
